# Example: SaaS web app on Next.js + Supabase that takes payments
project:
  type: web-app
  data: [personal, payments]
  users: 12000
  rollback: "Vercel instant rollback (~1 min); migrations are expand/contract"
  deploy: vercel
  owners: ["@lead-dev"]

commands:
  test: pnpm test
  lint: pnpm lint
  typecheck: pnpm typecheck
  build: pnpm build
  e2e: pnpm exec playwright test

sensitive:
  - "app/api/webhooks/**"
  - "supabase/functions/**"
  - "lib/pricing/**"

relaxed:
  - "lib/database.types.ts"   # generated by supabase gen types

freeze:
  - "Fri 16:00-Mon 08:00"

review:
  max_comments: 12
  nits: false
