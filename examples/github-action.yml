# keel automatic PR review — copy to .github/workflows/keel-review.yml
#
# Reviews every PR with keel-review and posts one review (summary + inline comments).
# Secrets:
#   ANTHROPIC_API_KEY  for the agent
#   KEEL_GH_TOKEN      a fine-grained token of the reviewer (Pull requests: read & write on
#                      this repo). Reviews then appear under that person's name. Without it
#                      the default token is used and reviews show as github-actions[bot].
#   KEEL_VOICE         optional: contents of the reviewer's ~/.config/keel/voice.md
# GitHub does not expose secrets to PRs from forks, so fork PRs are skipped.
name: keel review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  keel:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install keel skills
        run: |
          git clone --depth 1 https://github.com/manubidegain/keel "$RUNNER_TEMP/keel"
          mkdir -p .claude/skills
          cp -R "$RUNNER_TEMP"/keel/skills/* .claude/skills/
          mkdir -p ~/.config/keel
          printf '%s' "$KEEL_VOICE" > ~/.config/keel/voice.md
          [ -s ~/.config/keel/voice.md ] || rm ~/.config/keel/voice.md
        env:
          KEEL_VOICE: ${{ secrets.KEEL_VOICE }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use the keel-review skill to review this pull request.
            This is an unattended CI run: there is no person to confirm, so after drafting
            the review, post it with post_review.sh using `event: COMMENT`. Write it in the
            reviewer's voice (~/.config/keel/voice.md if present). Add no attribution.
            Do not run the project's code or tests. Do not post anything else.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(bash .claude/skills/keel-review/scripts/*),Bash(git diff:*),Bash(git log:*),Bash(gh api:*)"
        env:
          GH_TOKEN: ${{ secrets.KEEL_GH_TOKEN || github.token }}
